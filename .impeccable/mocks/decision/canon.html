<!doctype html>
<html lang="en"><head><meta charset="utf-8"><title>Category standard</title>
<style>
  * { box-sizing:border-box; margin:0; }
  body { width:1440px; height:900px; background:#fff; font-family:system-ui,"Segoe UI",Arial,sans-serif; color:#0f172a; overflow:hidden; }
  nav { display:flex; justify-content:space-between; align-items:center; padding:22px 96px; border-bottom:1px solid #e2e8f0; }
  nav b { font-size:24px; }
  nav .r { display:flex; gap:28px; align-items:center; font-size:15px; color:#475569; }
  nav .cta { background:#2563eb; color:#fff; padding:10px 18px; border-radius:8px; }
  .hero { display:grid; grid-template-columns:1fr 1fr; gap:64px; padding:80px 96px 40px; align-items:center; }
  h1 { font-size:58px; line-height:1.05; letter-spacing:-1.5px; font-weight:800; }
  p { font-size:20px; color:#475569; margin-top:20px; line-height:1.5; }
  .search { margin-top:32px; display:flex; border:1px solid #e2e8f0; border-radius:12px; padding:8px; box-shadow:0 6px 20px #0f172a14; }
  .search span { flex:1; padding:12px 14px; color:#94a3b8; font-size:16px; }
  .search b { background:#2563eb; color:#fff; padding:12px 22px; border-radius:8px; }
  .shot { height:420px; border-radius:16px; background:#f1f5f9; border:1px solid #e2e8f0; padding:24px; display:flex; flex-direction:column; gap:12px; }
  .row { height:62px; background:#fff; border-radius:10px; border:1px solid #e2e8f0; }
  .logos { display:flex; gap:56px; justify-content:center; color:#94a3b8; font-weight:700; font-size:18px; padding-top:24px; }
</style></head>
<body>
<nav><b>Visus</b><div class="r"><span>Clinics</span><span>For professionals</span><span>Sign in</span><span class="cta">Get started</span></div></nav>
<section class="hero">
  <div>
    <h1>Staff your optometry clinic in minutes</h1>
    <p>Connect with verified eye care professionals for flexible shifts across Toronto.</p>
    <div class="search"><span>Position type, date or clinic</span><b>Find shifts</b></div>
  </div>
  <div class="shot"><div class="row"></div><div class="row"></div><div class="row"></div><div class="row"></div><div class="row"></div></div>
</section>
<div class="logos"><span>15 clinics</span><span>12 roles</span><span>15-min matching</span><span>Verified staff</span></div>
</body></html>
